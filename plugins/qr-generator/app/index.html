<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Code</title>
<style>
:root { color-scheme: light dark; --bg:#f6f5f2; --card:#ffffff; --fg:#15162a; --muted:#5b5e78; --line:rgba(20,22,40,.12); --accent:#ff5a2a; --ok:#1a7f37; --bad:#c62828; }
@media (prefers-color-scheme: dark) { :root { --bg:#0d0e14; --card:#171923; --fg:#f3f2ef; --muted:#9a9cb2; --line:rgba(255,255,255,.12); --ok:#7ee787; --bad:#ff8a80; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, sans-serif; min-height: 100vh; }
.wrap { max-width: 880px; margin: 0 auto; padding: 28px 22px 60px; }
h1 { font: 600 26px/1.2 -apple-system, sans-serif; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 22px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
input[type=text], input[type=number], input[type=search], input[type=password], textarea, select {
  width: 100%; font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 9px 11px; border-radius: 10px;
  border: 1px solid var(--line); background: transparent; color: var(--fg); outline: none; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
textarea { min-height: 150px; resize: vertical; line-height: 1.45; }
button { font: 600 14px -apple-system, sans-serif; border: 0; border-radius: 10px; padding: 8px 15px; cursor: pointer; background: var(--fg); color: var(--bg); }
button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
button:active { transform: scale(.97); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1 1 200px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs button { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.tabs button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.muted { color: var(--muted); font-size: 13px; }
.ok { color: var(--ok); } .bad { color: var(--bad); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: rgba(20,20,28,.92); color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast.on { opacity: 1; }
.hide { display: none !important; }
</style></head>
<body>

<div class="wrap">
  <h1>QR Code</h1>
  <p class="sub">Make a QR code from a link, some text or your Wi-Fi. It's drawn on this Mac; what you type is never sent anywhere.</p>
  <div class="tabs" id="kind"><button data-k="text" class="on">Link or text</button><button data-k="wifi">Wi-Fi</button></div>
  <div class="row" style="align-items:flex-start">
    <div class="card" style="flex:1 1 300px;min-width:0">
      <div id="p-text"><label for="txt">Link or text</label><textarea id="txt" spellcheck="false" style="min-height:110px" placeholder="https://example.com"></textarea></div>
      <div id="p-wifi" class="hide">
        <label for="ssid">Network name</label><input type="text" id="ssid" spellcheck="false">
        <label for="wpass" style="margin-top:10px">Password</label><input type="text" id="wpass" spellcheck="false">
        <label for="wsec" style="margin-top:10px">Security</label><select id="wsec"><option value="WPA">WPA / WPA2 / WPA3</option><option value="WEP">WEP</option><option value="nopass">None</option></select>
      </div>
      <div class="row" style="margin-top:12px">
        <div class="grow"><label for="ecl">Error correction</label><select id="ecl"><option value="0">Low (smallest)</option><option value="1" selected>Medium</option><option value="2">Quartile</option><option value="3">High (most robust)</option></select></div>
        <div class="grow"><label for="px">Size <span id="pxv" class="muted"></span></label><input type="range" id="px" min="200" max="1200" step="20" value="480"></div>
      </div>
      <div id="msg" class="bad" style="margin-top:8px"></div>
    </div>
    <div class="card" style="text-align:center;flex:1 1 280px;min-width:0">
      <canvas id="cv" width="480" height="480" style="width:100%;max-width:480px;height:auto;aspect-ratio:1;border-radius:8px;background:#fff"></canvas>
      <div class="row" style="justify-content:center;margin-top:12px"><button id="png">Save PNG</button><button id="svg" class="ghost">Save SVG</button></div>
      <div class="muted" id="info" style="margin-top:8px"></div>
    </div>
  </div>
</div>

<script>
(() => {

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const store = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let toastTimer = 0;
const flash = (text) => {
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = text; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 1300);
};
// The clipboard API needs a secure page; if the page isn't, the old way works.
const copy = async (text) => {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const t = document.createElement('textarea'); t.value = text; t.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e2) {} t.remove();
  }
  flash('Copied');
};
// A random whole number below n, without bias.
const rand = (n) => {
  const limit = Math.floor(4294967296 / n) * n, buf = new Uint32Array(1);
  do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
  return buf[0] % n;
};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));


// ---- QR code encoder: byte mode, versions 1 to 40, four error-correction levels.
const ECC_PER_BLOCK = [
  [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
  [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28],
  [-1, 13, 22, 18, 26, 18, 24, 18, 22, 20, 24, 28, 26, 24, 20, 30, 24, 28, 28, 26, 30, 28, 30, 30, 30, 30, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
  [-1, 17, 28, 22, 16, 22, 28, 26, 26, 24, 28, 24, 28, 22, 24, 24, 30, 28, 28, 26, 28, 30, 24, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
];
const NUM_BLOCKS = [
  [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],
  [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49],
  [-1, 1, 1, 2, 2, 4, 4, 6, 6, 8, 8, 8, 10, 12, 16, 12, 17, 16, 18, 21, 20, 23, 23, 25, 27, 29, 34, 34, 35, 38, 40, 43, 45, 48, 51, 53, 56, 59, 62, 65, 68],
  [-1, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25, 25, 34, 30, 32, 35, 37, 40, 42, 45, 48, 51, 54, 57, 60, 63, 66, 70, 74, 77, 81],
];
const FORMAT_BITS = [1, 0, 3, 2];   // L, M, Q, H
const rawModules = (v) => {
  let r = (16 * v + 128) * v + 64;
  if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; }
  return r;
};
const dataCodewords = (v, e) => Math.floor(rawModules(v) / 8) - ECC_PER_BLOCK[e][v] * NUM_BLOCKS[e][v];
const gfMul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z; };
const rsDivisor = (degree) => {
  const r = new Array(degree).fill(0); r[degree - 1] = 1; let root = 1;
  for (let i = 0; i < degree; i++) { for (let j = 0; j < r.length; j++) { r[j] = gfMul(r[j], root); if (j + 1 < r.length) r[j] ^= r[j + 1]; } root = gfMul(root, 2); }
  return r;
};
const rsRemainder = (data, div) => {
  const r = div.map(() => 0);
  for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= gfMul(c, f); }); }
  return r;
};
const bytesOf = (text) => [...new TextEncoder().encode(text)];

const encode = (text, ecl) => {
  const bytes = bytesOf(text);
  let ver = 0, used = 0;
  for (ver = 1; ver <= 40; ver++) {
    const cap = dataCodewords(ver, ecl) * 8, ccBits = ver < 10 ? 8 : 16;
    used = 4 + ccBits + bytes.length * 8;
    if (used <= cap) break;
    if (ver === 40) return null;
  }
  const bits = [];
  const put = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
  put(4, 4); put(bytes.length, ver < 10 ? 8 : 16); bytes.forEach((b) => put(b, 8));
  const capBits = dataCodewords(ver, ecl) * 8;
  put(0, Math.min(4, capBits - bits.length)); put(0, (8 - (bits.length % 8)) % 8);
  for (let pad = 0xEC; bits.length < capBits; pad ^= 0xEC ^ 0x11) put(pad, 8);
  const data = []; for (let i = 0; i < bits.length; i += 8) data.push(parseInt(bits.slice(i, i + 8).join(''), 2));

  // error correction, interleaved
  const nb = NUM_BLOCKS[ecl][ver], eccLen = ECC_PER_BLOCK[ecl][ver], raw = Math.floor(rawModules(ver) / 8);
  const shortCount = nb - (raw % nb), shortLen = Math.floor(raw / nb), div = rsDivisor(eccLen), blocks = [];
  for (let i = 0, k = 0; i < nb; i++) {
    const dat = data.slice(k, k + shortLen - eccLen + (i < shortCount ? 0 : 1)); k += dat.length;
    const ecc = rsRemainder(dat, div); if (i < shortCount) dat.push(0); blocks.push(dat.concat(ecc));
  }
  const all = [];
  for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== shortLen - eccLen || j >= shortCount) all.push(b[i]); });

  const size = ver * 4 + 17;
  const mod = Array.from({ length: size }, () => new Array(size).fill(false)), fn = Array.from({ length: size }, () => new Array(size).fill(false));
  const setFn = (x, y, dark) => { mod[y][x] = dark; fn[y][x] = true; };
  for (let i = 0; i < size; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }
  const finder = (cx, cy) => {
    for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
      const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy;
      if (x >= 0 && x < size && y >= 0 && y < size) setFn(x, y, d !== 2 && d !== 4);
    }
  };
  finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
  const align = [];
  if (ver > 1) {
    const n = Math.floor(ver / 7) + 2, step = ver === 32 ? 26 : Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2;
    align.push(6); for (let p = size - 7; align.length < n; p -= step) align.splice(1, 0, p);
  }
  align.forEach((cx, i) => align.forEach((cy, j) => {
    if ((i === 0 && j === 0) || (i === 0 && j === align.length - 1) || (i === align.length - 1 && j === 0)) return;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) setFn(cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
  }));
  const formatBits = (mask) => {
    const d = (FORMAT_BITS[ecl] << 3) | mask; let rem = d;
    for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    const b = ((d << 10) | rem) ^ 0x5412, bit = (i) => ((b >>> i) & 1) !== 0;
    for (let i = 0; i <= 5; i++) setFn(8, i, bit(i));
    setFn(8, 7, bit(6)); setFn(8, 8, bit(7)); setFn(7, 8, bit(8));
    for (let i = 9; i < 15; i++) setFn(14 - i, 8, bit(i));
    for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, bit(i));
    for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, bit(i));
    setFn(8, size - 8, true);
  };
  formatBits(0);
  if (ver >= 7) {
    let rem = ver; for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
    const b = (ver << 12) | rem;
    for (let i = 0; i < 18; i++) { const bit = ((b >>> i) & 1) !== 0, a = size - 11 + (i % 3), c = Math.floor(i / 3); setFn(a, c, bit); setFn(c, a, bit); }
  }
  // codewords in the zigzag
  let bi = 0;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
      const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
      if (!fn[y][x] && bi < all.length * 8) { mod[y][x] = ((all[bi >>> 3] >>> (7 - (bi & 7))) & 1) !== 0; bi++; }
    }
  }
  const mask = (m) => {
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const inv = [(x + y) % 2 === 0, y % 2 === 0, x % 3 === 0, (x + y) % 3 === 0, (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
        (x * y) % 2 + (x * y) % 3 === 0, ((x * y) % 2 + (x * y) % 3) % 2 === 0, ((x + y) % 2 + (x * y) % 3) % 2 === 0][m];
      if (!fn[y][x] && inv) mod[y][x] = !mod[y][x];
    }
  };
  const penalty = () => {
    let p = 0, dark = 0;
    const line = (get) => {
      let run = 1, s = '';
      for (let i = 0; i < size; i++) {
        const v = get(i); s += v ? '1' : '0';
        if (i > 0 && v === get(i - 1)) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1;
      }
      for (const pat of ['10111010000', '00001011101']) { let at = s.indexOf(pat); while (at !== -1) { p += 40; at = s.indexOf(pat, at + 1); } }
    };
    for (let y = 0; y < size; y++) line((i) => mod[y][i]);
    for (let x = 0; x < size; x++) line((i) => mod[i][x]);
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      if (mod[y][x]) dark++;
      if (x < size - 1 && y < size - 1 && mod[y][x] === mod[y][x + 1] && mod[y][x] === mod[y + 1][x] && mod[y][x] === mod[y + 1][x + 1]) p += 3;
    }
    return p + 10 * Math.floor(Math.abs(dark * 100 / (size * size) - 50) / 5);
  };
  let best = 0, bestP = Infinity;
  for (let m = 0; m < 8; m++) { mask(m); formatBits(m); const p = penalty(); if (p < bestP) { bestP = p; best = m; } mask(m); }
  mask(best); formatBits(best);
  return { size, modules: mod, version: ver };
};
globalThis.__qr = { encode, capacity: (v, e) => Math.floor((dataCodewords(v, e) * 8 - 4 - (v < 10 ? 8 : 16)) / 8) };

// ---- Screen
let kind = store.get('qr.kind', 'text');
const payload = () => {
  if (kind === 'text') return $('#txt').value;
  const e = (s) => s.replace(/([\\;,:"])/g, '\\$1');
  const sec = $('#wsec').value;
  return $('#ssid').value ? 'WIFI:T:' + sec + ';S:' + e($('#ssid').value) + ';' + (sec === 'nopass' ? '' : 'P:' + e($('#wpass').value) + ';') + ';' : '';
};
let current = null;
const draw = () => {
  const text = payload(), cv = $('#cv'), ctx = cv.getContext('2d'), px = +$('#px').value;
  $('#pxv').textContent = px + ' px';
  store.set('qr.state', { txt: $('#txt').value, ssid: $('#ssid').value, ecl: $('#ecl').value, px });
  $('#msg').textContent = ''; $('#info').textContent = ''; current = null;
  cv.width = cv.height = px; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, px, px);
  if (!text) { $('#info').textContent = 'Type something to make a code'; return; }
  const q = encode(text, +$('#ecl').value);
  if (!q) { $('#msg').textContent = 'That is too long for a QR code. Shorten it or lower the error correction.'; return; }
  current = q;
  const quiet = 4, total = q.size + quiet * 2, cell = Math.floor(px / total), off = Math.floor((px - cell * q.size) / 2);
  ctx.fillStyle = '#000';
  for (let y = 0; y < q.size; y++) for (let x = 0; x < q.size; x++) if (q.modules[y][x]) ctx.fillRect(off + x * cell, off + y * cell, cell, cell);
  $('#info').textContent = 'Version ' + q.version + ' · ' + q.size + '×' + q.size + ' modules';
};
const download = (blob, name) => {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
};
$('#png').onclick = () => { if (current) $('#cv').toBlob((b) => b && download(b, 'qr-code.png'), 'image/png'); };
$('#svg').onclick = () => {
  if (!current) return;
  const q = current, n = q.size + 8; let path = '';
  for (let y = 0; y < q.size; y++) for (let x = 0; x < q.size; x++) if (q.modules[y][x]) path += 'M' + (x + 4) + ',' + (y + 4) + 'h1v1h-1z';
  download(new Blob(['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="' + path + '" fill="#000"/></svg>'], { type: 'image/svg+xml' }), 'qr-code.svg');
};
const showKind = (k) => {
  kind = k; store.set('qr.kind', k);
  $$('#kind button').forEach((b) => b.classList.toggle('on', b.dataset.k === k));
  $('#p-text').classList.toggle('hide', k !== 'text'); $('#p-wifi').classList.toggle('hide', k !== 'wifi'); draw();
};
$('#kind').onclick = (e) => { if (e.target.dataset.k) showKind(e.target.dataset.k); };
const saved = store.get('qr.state', null);
if (saved) { $('#txt').value = saved.txt || ''; $('#ssid').value = saved.ssid || ''; $('#ecl').value = saved.ecl || '1'; $('#px').value = saved.px || 480; }
['#txt', '#ssid', '#wpass', '#wsec', '#ecl', '#px'].forEach((s) => { $(s).oninput = draw; $(s).onchange = draw; });
showKind(kind);

})();
</script>
</body></html>
